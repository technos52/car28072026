name: iOS App Store Deployment

on:
  push:
    branches: [ main, release ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Compatible p12 on Mac
        id: gen_p12
        run: |
          # Download Apple WWDR Certificates (G3 and G6 are standard for current Distribution certs)
          curl -sL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o wwdr_g3.cer
          curl -sL https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer -o wwdr_g6.cer
          openssl x509 -inform der -in wwdr_g3.cer -out wwdr_g3.pem
          openssl x509 -inform der -in wwdr_g6.cer -out wwdr_g6.pem
          cat wwdr_g3.pem wwdr_g6.pem > wwdr.pem
          
          echo "${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_CER }}" | base64 --decode > distribution.cer
          echo "${{ secrets.IOS_DISTRIBUTION_PRIVATE_KEY }}" | base64 --decode > distribution.key
          openssl x509 -inform der -in distribution.cer -out distribution.pem
          
          # Bundle everything into a complete p12
          openssl pkcs12 -export -out distribution.p12 -inkey distribution.key -in distribution.pem -certfile wwdr.pem -passout pass:Dealmate2026!
          P12_B64=$(base64 -i distribution.p12)
          echo "p12_base64<<EOF" >> $GITHUB_OUTPUT
          echo "$P12_B64" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Import Code Signing Certificates
        uses: Apple-Actions/import-codesign-certs@v1
        with:
          p12-file-base64: ${{ steps.gen_p12.outputs.p12_base64 }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}

      - name: Install Provisioning Profile
        uses: Apple-Actions/download-provisioning-profiles@v1
        with:
          bundle-id: 'com.shailesh.DealMatee'
          profile-type: 'IOS_APP_STORE'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}

      - name: Build iOS IPA
        run: |
          # Use the GitHub run number to ensure a unique, increasing build number
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100)) 
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=ios/ExportOptions.plist

      - name: Rename IPA
        run: mv build/ios/ipa/*.ipa build/ios/ipa/app.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa
          path: build/ios/ipa/app.ipa

      - name: Upload to App Store Connect
        uses: Apple-Actions/upload-testflight-build@v1
        with:
          app-path: 'build/ios/ipa/app.ipa'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
